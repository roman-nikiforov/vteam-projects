<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fusion Feedback Dashboard</title>
    <script>
      (() => {
        const param = new URLSearchParams(window.location.search).get("scoutTheme");
        const theme =
          param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
    <style>
      :root {
        color-scheme: light;
        --cp-bg: #f7f4ef;
        --cp-bg-elevated: #fcfbf8;
        --cp-surface: #ffffff;
        --cp-surface-soft: #f5f5f5;
        --cp-border: #dedede;
        --cp-border-strong: #919191;
        --cp-text: #242424;
        --cp-text-muted: #5c5c5c;
        --cp-text-soft: #6f6f6f;
        --cp-accent: #b11f4b;
        --cp-accent-hover: #9a1a41;
        --cp-accent-soft: rgba(177, 31, 75, 0.08);
        --cp-accent-fg: #ffffff;
        --cp-success: #16a34a;
        --cp-danger: #dc2626;
        --cp-warning: #f59e0b;
        --cp-link: #0078d4;
        --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
        --cp-overlay: rgba(255, 255, 255, 0.8);
        --cp-panel: rgba(255, 255, 255, 0.86);
        --cp-panel-strong: rgba(255, 255, 255, 0.96);
        --cp-sheen: rgba(255, 255, 255, 0.55);
        --cp-highlight: rgba(177, 31, 75, 0.12);
      }
      html[data-theme="dark"] {
        color-scheme: dark;
        --cp-bg: #3d3b3a;
        --cp-bg-elevated: #343231;
        --cp-surface: #292929;
        --cp-surface-soft: #2e2e2e;
        --cp-border: #474747;
        --cp-border-strong: #5f5f5f;
        --cp-text: #dedede;
        --cp-text-muted: #919191;
        --cp-text-soft: #b0b0b0;
        --cp-accent: #fd8ea1;
        --cp-accent-hover: #fb7b91;
        --cp-accent-soft: rgba(253, 142, 161, 0.14);
        --cp-accent-fg: #1a1a1a;
        --cp-success: #4ade80;
        --cp-danger: #f87171;
        --cp-warning: #fbbf24;
        --cp-link: #4da6ff;
        --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
        --cp-overlay: rgba(41, 41, 41, 0.88);
        --cp-panel: rgba(41, 41, 41, 0.72);
        --cp-panel-strong: rgba(41, 41, 41, 0.96);
        --cp-sheen: rgba(255, 255, 255, 0.04);
        --cp-highlight: rgba(253, 142, 161, 0.12);
      }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--cp-bg);
        color: var(--cp-text);
        font-family: "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif;
      }
      .app {
        width: min(1280px, 100%);
        margin: 0 auto;
        padding: 1.5rem;
        display: grid;
        gap: 1rem;
      }
      .card {
        background: var(--cp-surface);
        border: 1px solid var(--cp-border);
        border-radius: 16px;
        box-shadow: 0 0 2px rgba(0, 0, 0, 0.12), 0 1px 2px rgba(0, 0, 0, 0.14);
        padding: 1rem;
      }
      .header h1 {
        margin: 0;
        font-size: 1.5rem;
      }
      .header p {
        margin: 0.5rem 0 0;
        color: var(--cp-text-muted);
      }
      .grid {
        display: grid;
        gap: 0.75rem;
      }
      .grid-2 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .grid-3 {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      .field {
        display: grid;
        gap: 0.35rem;
      }
      label {
        color: var(--cp-text-muted);
        font-size: 0.82rem;
      }
      input,
      button,
      select {
        background: var(--cp-surface-soft);
        color: var(--cp-text);
        border: 1px solid var(--cp-border);
        border-radius: 0.625rem;
        padding: 0.55rem 0.7rem;
        font: inherit;
      }
      input:focus,
      select:focus {
        outline: 2px solid var(--cp-accent-soft);
        border-color: var(--cp-accent);
      }
      button {
        background: var(--cp-accent);
        color: var(--cp-accent-fg);
        cursor: pointer;
        border-color: var(--cp-accent);
      }
      button:hover {
        background: var(--cp-accent-hover);
        border-color: var(--cp-accent-hover);
      }
      .button-row {
        display: flex;
        gap: 0.5rem;
        align-items: center;
      }
      .button-row button.secondary {
        background: var(--cp-surface-soft);
        color: var(--cp-text);
        border-color: var(--cp-border);
      }
      .kpi {
        border-radius: 0.625rem;
        border: 1px solid var(--cp-border);
        background: var(--cp-bg-elevated);
        padding: 0.8rem;
      }
      .kpi .label {
        color: var(--cp-text-muted);
        font-size: 0.82rem;
      }
      .kpi .value {
        font-size: 1.4rem;
        font-weight: 600;
        margin-top: 0.3rem;
      }
      .section-title {
        margin: 0 0 0.75rem;
        font-size: 1.05rem;
      }
      .bars {
        display: grid;
        gap: 0.5rem;
      }
      .bar-row {
        display: grid;
        grid-template-columns: 220px 1fr 48px;
        gap: 0.5rem;
        align-items: center;
      }
      .bar-name {
        color: var(--cp-text-soft);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .bar-track {
        height: 0.7rem;
        background: var(--cp-surface-soft);
        border-radius: 999px;
        overflow: hidden;
      }
      .bar-fill {
        height: 100%;
        background: var(--cp-accent);
      }
      .bar-value {
        text-align: right;
        color: var(--cp-text-muted);
        font-variant-numeric: tabular-nums;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        border-bottom: 1px solid var(--cp-border);
        text-align: left;
        padding: 0.55rem 0.35rem;
        font-size: 0.92rem;
      }
      th {
        color: var(--cp-text-muted);
        font-weight: 600;
      }
      a {
        color: var(--cp-link);
        text-decoration: none;
      }
      .mono {
        font-family: Consolas, "Courier New", Courier, monospace;
      }
      .status {
        color: var(--cp-text-muted);
        font-size: 0.9rem;
      }
      .hidden {
        display: none;
      }
      @media (max-width: 960px) {
        .grid-3,
        .grid-2 {
          grid-template-columns: 1fr;
        }
        .bar-row {
          grid-template-columns: 140px 1fr 36px;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <section class="card header">
        <h1>Fusion Feedback Dashboard</h1>
        <p>
          Dashboard for <strong>Dynamics 365 Contact Center and Agents</strong> v-Team feedback items.
        </p>
      </section>

      <section class="card">
        <h2 class="section-title">Connection</h2>
        <div class="grid grid-3">
          <div class="field">
            <label for="apiUrl">Fusion endpoint</label>
            <input
              id="apiUrl"
              value="https://successhub.crm.dynamics.com/api/data/v9.2/ft_feedbackitems"
            />
          </div>
          <div class="field">
            <label for="vTeamName">v-Team name</label>
            <input id="vTeamName" value="Dynamics 365 Contact Center and Agents" />
          </div>
          <div class="field">
            <label for="token">Bearer token (optional)</label>
            <input id="token" type="password" placeholder="eyJ0eXAiOiJKV1Qi..." />
          </div>
        </div>
        <div class="grid grid-3" style="margin-top: 0.75rem">
          <div class="field">
            <label for="vTeamField">v-Team field (optional)</label>
            <input id="vTeamField" placeholder="Example: ft_vteamname" />
          </div>
          <div class="field">
            <label for="topN">Top owners (N)</label>
            <input id="topN" type="number" value="8" min="3" max="20" />
          </div>
          <div class="field">
            <label for="maxRows">Rows to request</label>
            <input id="maxRows" type="number" value="5000" min="50" max="10000" />
          </div>
        </div>
        <div class="button-row" style="margin-top: 0.85rem">
          <button id="loadBtn">Load dashboard</button>
          <button class="secondary" id="resetBtn">Reset</button>
          <span class="status" id="status">Idle</span>
        </div>
      </section>

      <section class="grid grid-3 hidden" id="kpis"></section>

      <section class="grid grid-2 hidden" id="charts">
        <div class="card">
          <h2 class="section-title">By status</h2>
          <div class="bars" id="statusBars"></div>
        </div>
        <div class="card">
          <h2 class="section-title">By owner</h2>
          <div class="bars" id="ownerBars"></div>
        </div>
      </section>

      <section class="card hidden" id="trendCard">
        <h2 class="section-title">Created per month (last 12 months)</h2>
        <div class="bars" id="trendBars"></div>
      </section>

      <section class="card hidden" id="tableCard">
        <h2 class="section-title">Latest feedback items</h2>
        <table>
          <thead>
            <tr>
              <th>Title</th>
              <th>Status</th>
              <th>Owner</th>
              <th>Created</th>
              <th>ID</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
